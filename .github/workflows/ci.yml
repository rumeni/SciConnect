name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q

  # The fast suite above runs on in-memory SQLite. This job runs the
  # production dialect: migrations from an empty database, then API and
  # constraint tests. It uses a disposable service container only; no
  # secrets or remote databases are involved.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sciconnect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sciconnect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - name: Migrate an empty database with the Alembic CLI
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/sciconnect_ci
        run: |
          alembic upgrade head
          alembic current
          alembic check
      - name: Integration tests on PostgreSQL
        env:
          INTEGRATION_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/postgres
        run: python -m pytest -q -ra tests_integration

  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production API image
        run: docker build --tag sciconnect-api:ci backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
