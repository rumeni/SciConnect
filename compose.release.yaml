# Overlay for manually approved, digest-pinned releases only.
# Always combine with compose.prod.yaml and use --no-build --pull always.
# Normal docker compose development/production builds are unchanged.
services:
  api:
    image: ${SCICONNECT_API_IMAGE:?approved API image digest required}
    environment:
      # Production migrations run explicitly, after a verified backup and before
      # the new API is started. Never migrate implicitly on a container restart.
      APP_RUN_MIGRATIONS: "false"
      APP_SEED_ON_STARTUP: "false"
  frontend:
    image: ${SCICONNECT_FRONTEND_IMAGE:?approved frontend image digest required}
