# Response headers for the page itself.
#
# Included rather than set once at server level because nginx's add_header does
# not merge: a location block that sets any header of its own loses every
# header inherited from the server. Every location that adds a Cache-Control
# therefore includes this file too.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# The browser features this page may use. The map asks for the visitor's
# location, so geolocation stays available to the page itself; everything else
# is refused, including for anything the page might embed.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), accelerometer=()" always;

# What the page is allowed to load.
#
#   script-src 'self'   the bundle and config.js, both served from here
#   style-src  …inline  Leaflet positions tiles and markers by writing inline
#                       style attributes; without this the map cannot draw
#   img-src    tiles    OpenStreetMap serves the map tiles
#   connect-src 'self'  the API is reached through this same origin, proxied at
#                       /api by the front door. An API on another host has to
#                       be named here as well
#   frame-ancestors     nothing may frame this page, in any browser
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
